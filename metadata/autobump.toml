# Declarative automation configuration for this Gentoo overlay.
# Everything in .github/autobump/engine/ is overlay-agnostic and driven by this file.
#
# Strict schema conventions:
# - Strategy-specific options live inside `strategy = { type = "...", ... }` (never top-level).
# - Inline `smoke_test` shell commands are forbidden; place smoke tests in `.github/smoke/<cat>/<pn>.sh`.

[overlay]
name = "locez"
repository = "locez/locez-overlay"
distfiles_repo = "locez/locez-overlay-distfiles"
base_branch = "master"
maintainer = "locez"

[build]
# Gentoo container image + desktop profile + official binhost for fast dependency installs
stage3_image = "docker.io/gentoo/stage3:latest"
profile = "default/linux/amd64/23.0/desktop"
use_binhost = true
binhost_uri = "https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/"

[notify]
github_issue = true
github_label = "autobump-failed"
# Telegram activates automatically when TELEGRAM_BOT_TOKEN & TELEGRAM_CHAT_ID secrets are set.
telegram = true
# Which event types push to Telegram: "failed", "ai_draft_pr", "zfs_unlocked", "health_alert", "merged"
telegram_events = ["failed", "ai_draft_pr", "zfs_unlocked", "health_alert"]

[ai_repair]
# Set enabled = true (or pass AI_REPAIR_CMD secret in CI) once your agent CLI (e.g. merry) is ready.
enabled = false
mode = "draft-pr"
max_attempts = 1
allowed_extra_paths = ["licenses/"]
# Command template receives: {context_file}, {pkg}, {repo_root}
# Override via repository secret AI_REPAIR_CMD if needed.
command = ""

[health]
# Online signer/URL health probes & explicit exemptions for untracked packages
probe_urls = ["https://overlay.locez.com/healthz"]
probe_packages = [
  "net-im/tencent-qq",
  "app-office/wps-office",
  "media-sound/qqmusic",
]
untracked_packages = [
  "dev-libs/denial-flutter-engine-bin",
  "gui-wm/denial",
  "gui-wm/denial-bin",
]

# =============================================================================
# Package Specifications (smoke tests auto-discovered from .github/smoke/<cat>/<pn>.sh)
# =============================================================================

[packages."app-emulation/dwproton-bin"]
detect = { type = "nvchecker", source = "gitea", gitea = "dawn-winery/dwproton", host = "dawn.wine", use_latest_release = true, prefix = "dwproton-", from_pattern = "-([0-9]+)$", to_pattern = "_p\\1" }
strategy = "dwproton"
retention = { type = "keep-latest", count = 3 }
policy = "auto-merge"
build = { mode = "emerge-bin", use = ["abi_x86_32"] }

[packages."app-emulation/proton-ge-bin"]
detect = { type = "nvchecker", source = "github", github = "GloriousEggroll/proton-ge-custom", use_latest_release = true, prefix = "GE-Proton", from_pattern = "^([0-9]+)-([0-9]+)$", to_pattern = "\\1.\\2" }
strategy = "proton-ge"
retention = { type = "keep-latest", count = 3 }
policy = "auto-merge"
build = { mode = "emerge-bin", use = ["abi_x86_32"] }

[packages."app-misc/herdr"]
detect = { type = "nvchecker", source = "github", github = "herdrdev/herdr", use_latest_release = true, prefix = "v" }
strategy = { type = "rust-vendor", zig = { manifest_dir = "vendor/libghostty-vt", deps = ["zlib", "highway", "wuffs", "translate_c", "iterm2_themes"] } }
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-full", test = false }

[packages."app-misc/herdr-bin"]
detect = { type = "nvchecker", source = "github", github = "herdrdev/herdr", use_latest_release = true, prefix = "v" }
strategy = { type = "github-release", url_template = "https://github.com/herdrdev/herdr/releases/download/v{ver}/herdr-linux-x86_64", dist_template = "herdr-bin-{ver}-amd64", extra_dists = [{ url_template = "https://github.com/herdrdev/herdr/releases/download/v{ver}/herdr-linux-aarch64", dist_template = "herdr-bin-{ver}-arm64" }] }
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-bin" }

[packages."dev-python/pure-protobuf"]
detect = { type = "nvchecker", source = "pypi", pypi = "pure-protobuf" }
strategy = "pypi"
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-full", test = true }

[packages."dev-python/qasync"]
detect = { type = "nvchecker", source = "pypi", pypi = "qasync" }
strategy = "pypi"
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-full", test = false }

[packages."media-libs/libdicom"]
detect = { type = "nvchecker", source = "github", github = "ImagingDataCommons/libdicom", use_latest_release = true, prefix = "v" }
strategy = { type = "github-release", url_template = "https://github.com/ImagingDataCommons/libdicom/releases/download/v{ver}/libdicom-{ver}.tar.xz", dist_template = "libdicom-{ver}.tar.xz" }
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-full", test = true }

[packages."media-libs/openslide"]
detect = { type = "nvchecker", source = "github", github = "openslide/openslide", use_latest_release = true, prefix = "v" }
strategy = { type = "github-release", url_template = "https://github.com/openslide/openslide/releases/download/v{ver}/openslide-{ver}.tar.xz", dist_template = "openslide-{ver}.tar.xz" }
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-full", test = false }

[packages."media-sound/cider"]
detect = { type = "nvchecker", source = "regex", url = "https://repo.cider.sh/apt/pool/main/", regex = 'cider-v([0-9]+(?:\.[0-9]+)+)-linux-x64\.deb' }
strategy = "cider"
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-bin" }

[packages."net-im/tencent-qq"]
detect = { type = "nvchecker", source = "regex", url = "https://cdn-go.cn/qq-web/im.qq.com_new/latest/rainbow/linuxConfig.js", regex = 'QQ_([0-9]+(?:\.[0-9]+)+_[0-9]+)_amd64_01\.deb', from_pattern = "_([0-9]+)$", to_pattern = "_p\\1" }
strategy = "tencent-qq"
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-bin", use = ["bwrap", "system-fdk-aac", "system-libssh2", "system-openh264", "system-zlib"] }

[packages."net-im/wechat"]
detect = { type = "wechat-head" }
strategy = "wechat"
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-bin", use = ["bwrap"] }

[packages."net-misc/tsshd"]
detect = { type = "nvchecker", source = "github", github = "trzsz/tsshd", use_latest_release = true, prefix = "v" }
strategy = { type = "go-vendor", build_target = "./cmd/tsshd" }
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-full", test = true }

[packages."sys-kernel/xanmod-sources"]
detect = { type = "nvchecker", source = "gitlab", gitlab = "xanmod/linux", use_max_tag = true, include_regex = "[0-9]+\\.[0-9]+\\.[0-9]+-xanmod[0-9]+", from_pattern = "-xanmod[0-9]+$", to_pattern = "" }
strategy = "kernel-xanmod"
retention = { type = "replace", guard = "keep-last-zfs-compatible" }
policy = "auto-merge"
build = { mode = "kernel-sources", use_sets = [["-zfs"]], check_kconfig = true }

[packages."sys-kernel/cachyos-sources"]
detect = { type = "nvchecker", source = "github", github = "CachyOS/linux", use_max_tag = true, include_regex = "cachyos-[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+", from_pattern = "^cachyos-", to_pattern = "" }
strategy = "kernel-cachyos"
retention = { type = "replace", guard = "keep-last-zfs-compatible" }
policy = "auto-merge"
build = { mode = "kernel-sources", use_sets = [["bore", "rt", "thin", "-zfs"], ["-bore", "prjc", "-zfs"]], check_kconfig = true }

[packages."x11-misc/flatpak-xdg-utils"]
detect = { type = "nvchecker", source = "github", github = "flatpak/flatpak-xdg-utils", use_latest_release = true }
strategy = { type = "github-release", url_template = "https://github.com/flatpak/flatpak-xdg-utils/releases/download/{ver}/flatpak-xdg-utils-{ver}.tar.xz", dist_template = "flatpak-xdg-utils-{ver}.tar.xz" }
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-full", test = false }

[packages."media-sound/qqmusic"]
detect = { type = "nvchecker", source = "regex", url = "https://y.qq.com/download/download.html", regex = 'qqmusic_([0-9]+(?:\.[0-9]+)+)_amd64\.deb' }
strategy = "qqmusic"
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-bin" }

[packages."app-office/bytedance-feishu"]
detect = { type = "nvchecker", source = "regex", url = "https://www.feishu.cn/api/downloads", regex = 'Feishu-linux_x64-([0-9]+(?:\.[0-9]+)+)\.deb' }
strategy = "feishu"
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-bin" }

[packages."app-office/wps-office"]
detect = { type = "nvchecker", source = "regex", url = "https://linux.wps.cn/", regex = 'wps-office_([0-9]+(?:\.[0-9]+)+)\.AK\.preread\.sw\.Personal_[0-9]+_amd64\.deb' }
strategy = "wps-office"
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-bin" }

[packages."net-im/dingtalk"]
detect = { type = "nvchecker", source = "httpheader", url = "https://www.dingtalk.com/win/d/qd=linux_amd64", method = "GET", follow_redirects = false, header = "location", regex = 'com\.alibabainc\.dingtalk_([0-9]+(?:\.[0-9]+)+)_amd64\.deb' }
strategy = "dingtalk"
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-bin" }

[packages."net-misc/baidunetdisk"]
detect = { type = "nvchecker", source = "regex", url = "https://pan.baidu.com/disk/cmsdata?do=client", regex = 'baidunetdisk_([0-9]+(?:\.[0-9]+)+)_amd64\.deb' }
strategy = { type = "github-release", url_template = "https://issuecdn.baidupcs.com/issue/netdisk/LinuxGuanjia/{ver}/baidunetdisk_{ver}_amd64.deb", dist_template = "baidunetdisk_{ver}_amd64.deb" }
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-bin" }

[packages."sci-ml/llama-cpp"]
detect = { type = "nvchecker", source = "github", github = "ggml-org/llama.cpp", use_max_tag = true, include_regex = "b[0-9]+", from_pattern = "^b([0-9]+)$", to_pattern = "0_pre\\1" }
strategy = { type = "github-release", tag_ver_strip_prefix = "0_pre", url_template = "https://github.com/ggml-org/llama.cpp/archive/refs/tags/b{tag_ver}.tar.gz", dist_template = "llama-cpp-{ver}.tar.gz", extra_dists = [{ url_template = "https://github.com/ggml-org/llama.cpp/releases/download/b{tag_ver}/llama-b{tag_ver}-ui.tar.gz", dist_template = "llama-cpp-{ver}-ui.tar.gz" }], preserve_dists = ["ggml-org_models_tinyllamas_*.gguf"] }
cadence = "weekly"
retention = { type = "replace" }
policy = "auto-merge"
build = { mode = "emerge-full", use = ["-cuda", "-rocm", "-native", "-lto"], test = false }
weekly_live_test = true

