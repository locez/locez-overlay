name: "Gentoo Stage3 Build & Smoke Test"
description: "Render and execute a Gentoo stage3 + official binhost + CI binpkg cache emerge & smoke_test for a single overlay package"

inputs:
  package:
    description: "Package atom (category/name)"
    required: true
  live:
    description: "Build 9999 live ebuild"
    required: false
    default: "false"
  python-target:
    description: "Optional extra PYTHON_TARGETS impl to test (e.g. python3_15)"
    required: false
    default: ""
  log-dir:
    description: "Host directory where build logs and console.log are written"
    required: false
    default: "/tmp/build-logs"
  distdir:
    description: "Optional host directory containing pre-fetched distfiles to mount at /var/cache/distfiles"
    required: false
    default: ""
  free-disk:
    description: "Free extra runner disk space before starting container (useful for kernels/Proton)"
    required: false
    default: "auto"

runs:
  using: "composite"
  steps:
    - name: Free runner disk space for large builds
      shell: bash
      run: |
        if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
          exit 0
        fi
        SHOULD_FREE="${{ inputs.free-disk }}"
        if [ "$SHOULD_FREE" = "auto" ]; then
          case "${{ inputs.package }}" in
            sys-kernel/*|app-emulation/*) SHOULD_FREE="true" ;;
            *) SHOULD_FREE="false" ;;
          esac
        fi
        if [ "$SHOULD_FREE" = "true" ]; then
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /
        fi

    - name: Prepare Gentoo tree & binpkg cache keys
      id: cache_keys
      shell: bash
      run: |
        DAY="$(date -u +%Y-%m-%d)"
        WEEK="$(date -u +%Y-W%V)"
        ARCH="${RUNNER_ARCH:-$(uname -m)}"
        PY_TAG="${{ inputs.python-target }}"
        [ -z "$PY_TAG" ] && PY_TAG="default"
        PKG_SLUG="$(echo '${{ inputs.package }}' | tr '/:' '--')"

        CACHE_ROOT="${{ runner.temp }}/gentoo-cache"
        mkdir -p "${CACHE_ROOT}/gentoo-tree" "${CACHE_ROOT}/binpkgs"

        echo "cache_root=${CACHE_ROOT}" >> "$GITHUB_OUTPUT"
        echo "tree_dir=${CACHE_ROOT}/gentoo-tree" >> "$GITHUB_OUTPUT"
        echo "binpkg_dir=${CACHE_ROOT}/binpkgs" >> "$GITHUB_OUTPUT"
        echo "tree_key=gentoo-tree-v1-${DAY}" >> "$GITHUB_OUTPUT"
        echo "binpkg_prefix=gentoo-binpkgs-v1-${ARCH}-${WEEK}-${PY_TAG}-" >> "$GITHUB_OUTPUT"
        echo "binpkg_save_key=gentoo-binpkgs-v1-${ARCH}-${WEEK}-${PY_TAG}-${PKG_SLUG}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

    - name: Restore daily Gentoo Portage tree cache
      id: restore_tree
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.cache_keys.outputs.tree_dir }}
        key: ${{ steps.cache_keys.outputs.tree_key }}

    - name: Restore weekly Gentoo CI binpkg cache
      id: restore_binpkgs
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.cache_keys.outputs.binpkg_dir }}
        key: ${{ steps.cache_keys.outputs.binpkg_save_key }}
        restore-keys: |
          ${{ steps.cache_keys.outputs.binpkg_prefix }}

    - name: Render and run Gentoo stage3 build & smoke test
      id: build
      shell: bash
      run: |
        set -euo pipefail
        LOG_DIR="${{ inputs.log-dir }}"
        CACHE_ROOT="${{ steps.cache_keys.outputs.cache_root }}"
        TREE_DIR="${{ steps.cache_keys.outputs.tree_dir }}"
        BINPKG_DIR="${{ steps.cache_keys.outputs.binpkg_dir }}"
        mkdir -p "$LOG_DIR" "$TREE_DIR" "$BINPKG_DIR"

        BEFORE_BINPKGS="$(find "$BINPKG_DIR" -name '*.gpkg.tar' 2>/dev/null | wc -l)"

        LIVE_FLAG=""
        if [ "${{ inputs.live }}" = "true" ]; then
          LIVE_FLAG="--live"
        fi
        PY_ARGS=()
        if [ -n "${{ inputs.python-target }}" ]; then
          PY_ARGS=(--python-target "${{ inputs.python-target }}")
        fi

        SCRIPT_PATH="$(mktemp "${{ runner.temp }}/gentoo-build-test.XXXXXX.sh")"
        trap 'rm -f "$SCRIPT_PATH"' EXIT

        python3 .github/autobump/main.py render-build-script \
          --pkg "${{ inputs.package }}" \
          $LIVE_FLAG \
          "${PY_ARGS[@]}" \
          --overlay-mount /overlay \
          --log-dir /build-logs \
          --out "$SCRIPT_PATH"

        IMAGE="$(python3 .github/autobump/main.py config-info | python3 -c 'import json, sys; print(json.load(sys.stdin)["build"]["stage3_image"])')"

        DISTDIR_MOUNT=()
        if [ -n "${{ inputs.distdir }}" ] && [ -d "${{ inputs.distdir }}" ]; then
          DISTDIR_MOUNT=(-v "${{ inputs.distdir }}:/var/cache/distfiles")
        fi

        set +e
        docker run --rm \
          -v "${{ github.workspace }}:/overlay:ro" \
          -v "${SCRIPT_PATH}:/run-build-test.sh:ro" \
          -v "${LOG_DIR}:/build-logs" \
          -v "${TREE_DIR}:/var/db/repos/gentoo" \
          -v "${BINPKG_DIR}:/var/cache/binpkgs" \
          "${DISTDIR_MOUNT[@]}" \
          "$IMAGE" \
          bash /run-build-test.sh 2>&1 | tee "${LOG_DIR}/console.log"
        DOCKER_EXIT="${PIPESTATUS[0]}"
        set -e

        # Sanitize ':' in Portage log filenames so actions/upload-artifact accepts them on all runners
        if [ -d "$LOG_DIR" ]; then
          find "$LOG_DIR" -maxdepth 1 -name '*:*' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            mv -f "$f" "${f//:/_}" 2>/dev/null || true
          done
        fi

        # Ensure runner user owns cached files created by root inside Docker
        if [ "$(id -u)" -ne 0 ]; then
          sudo -n chown -R "$(id -u):$(id -g)" "$CACHE_ROOT" 2>/dev/null \
            || docker run --rm -v "${CACHE_ROOT}:/cache-fix" "$IMAGE" chown -R "$(id -u):$(id -g)" /cache-fix 2>/dev/null \
            || true
        fi

        if [ "${{ steps.restore_tree.outputs.cache-hit }}" != "true" ] && [ -d "${TREE_DIR}/metadata" ]; then
          echo "save_tree=true" >> "$GITHUB_OUTPUT"
        else
          echo "save_tree=false" >> "$GITHUB_OUTPUT"
        fi

        AFTER_BINPKGS="$(find "$BINPKG_DIR" -name '*.gpkg.tar' 2>/dev/null | wc -l)"
        BINPKG_MB="$(du -sm "$BINPKG_DIR" | awk '{print $1}')"
        echo "CI binpkg cache: ${BEFORE_BINPKGS} -> ${AFTER_BINPKGS} packages (${BINPKG_MB} MiB)"
        if [ "$AFTER_BINPKGS" -gt "$BEFORE_BINPKGS" ] && [ "$BINPKG_MB" -le 4096 ]; then
          echo "save_binpkgs=true" >> "$GITHUB_OUTPUT"
        else
          echo "save_binpkgs=false" >> "$GITHUB_OUTPUT"
        fi

        exit "$DOCKER_EXIT"

    - name: Save daily Gentoo Portage tree cache
      if: always() && steps.build.outputs.save_tree == 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ${{ steps.cache_keys.outputs.tree_dir }}
        key: ${{ steps.cache_keys.outputs.tree_key }}

    - name: Save weekly Gentoo CI binpkg cache
      if: always() && steps.build.outputs.save_binpkgs == 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ${{ steps.cache_keys.outputs.binpkg_dir }}
        key: ${{ steps.cache_keys.outputs.binpkg_save_key }}
