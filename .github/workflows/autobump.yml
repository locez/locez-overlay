name: Auto-Bump Packages

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      package:
        description: "Optional single package to check/bump (e.g. media-sound/cider)"
        required: false
        default: ""

concurrency:
  group: autobump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_updates: ${{ steps.detect.outputs.has_updates }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install nvchecker
        run: pip install --upgrade nvchecker

      - name: Detect outdated packages
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--detect --result-file /tmp/detect.json"
          if [ -n "${{ inputs.package }}" ]; then
            ARGS="$ARGS --only ${{ inputs.package }}"
          fi
          python3 .github/scripts/autobump.py $ARGS

          UPDATES=$(jq -c '.updates' /tmp/detect.json)
          COUNT=$(jq '.updates | length' /tmp/detect.json)
          echo "matrix=$UPDATES" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify on detection errors
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/detect.json ]; then
            exit 0
          fi
          ERR_COUNT=$(jq '.errors | length' /tmp/detect.json)
          if [ "$ERR_COUNT" -eq 0 ]; then
            exit 0
          fi
          gh label create "autobump-failed" --color "d93f0b" --description "Automated package bump failed" 2>/dev/null || true
          ERR_TEXT=$(jq -r '.errors[] | "- `\(.pkg)`: \(.error)"' /tmp/detect.json)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TITLE="[autobump-failed] version detection error"
          EXISTING=$(gh issue list --state open --label "autobump-failed" --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="@locez Version detection encountered errors:

          ${ERR_TEXT}

          Workflow run: ${RUN_URL}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "autobump-failed" --body "$BODY"
          fi

  bump:
    needs: detect
    if: needs.detect.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Go (for tsshd vendor tarball)
        if: matrix.pkg == 'net-misc/tsshd'
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Run autobump script
        id: bump
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/autobump.py \
            --pkg "${{ matrix.pkg }}" \
            --target "${{ matrix.upstream_ver }}" \
            --upload-vendor \
            --result-file /tmp/bump-result.json || true

          STATUS=$(jq -r '.status // "failed"' /tmp/bump-result.json)
          TARGET=$(jq -r '.target_ver // "${{ matrix.upstream_ver }}"' /tmp/bump-result.json)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "target_ver=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Run pkgcheck on bumped package
        id: pkgcheck
        if: steps.bump.outputs.status == 'bumped'
        continue-on-error: true
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: --exit error ${{ matrix.pkg }}

      - name: Create or update Pull Request
        if: steps.bump.outputs.status == 'bumped' && steps.pkgcheck.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ matrix.pkg }}"
          SLUG="${{ matrix.slug }}"
          LOCAL_VER="${{ matrix.local_ver }}"
          NEW_VER="${{ steps.bump.outputs.target_ver }}"
          BRANCH="autobump/${SLUG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A "$PKG"
          if git diff --cached --quiet; then
            echo "No changes to commit for $PKG"
            exit 0
          fi

          git commit -m "${PKG}: bump ${LOCAL_VER} -> ${NEW_VER}"
          git push --force origin "$BRANCH"

          PR_TITLE="${PKG}: bump ${LOCAL_VER} -> ${NEW_VER}"
          PR_BODY="Automated bump for \`${PKG}\` (\`${LOCAL_VER}\` -> \`${NEW_VER}\`).

          - Manifest updated (BLAKE2B + SHA512)
          - \`pkgcheck scan --exit error ${PKG}\` passed
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --base master --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
          fi

          # Auto-close any previously opened failure issue for this package
          FAIL_ISSUE=$(gh issue list --state open --label "autobump-failed" --search "[autobump-failed] ${PKG} in:title" --json number --jq '.[0].number // empty')
          if [ -n "$FAIL_ISSUE" ]; then
            gh issue close "$FAIL_ISSUE" --comment "Resolved by automated bump PR for \`${NEW_VER}\`."
          fi

      - name: Notify maintainer on failure
        if: steps.bump.outputs.status == 'failed' || (steps.bump.outputs.status == 'bumped' && steps.pkgcheck.outcome != 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ matrix.pkg }}"
          LOCAL_VER="${{ matrix.local_ver }}"
          NEW_VER="${{ steps.bump.outputs.target_ver }}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "${{ steps.bump.outputs.status }}" = "failed" ]; then
            REASON=$(jq -r '.message // "Unknown autobump error"' /tmp/bump-result.json)
          else
            REASON="pkgcheck scan --exit error failed for ${PKG} ${NEW_VER}. Check workflow logs."
          fi

          gh label create "autobump-failed" --color "d93f0b" --description "Automated package bump failed" 2>/dev/null || true

          TITLE="[autobump-failed] ${PKG}: ${LOCAL_VER} -> ${NEW_VER}"
          BODY="@locez Automated bump failed for \`${PKG}\`:

          - **Local version**: \`${LOCAL_VER}\`
          - **Upstream version**: \`${NEW_VER}\`
          - **Workflow run**: ${RUN_URL}

          \`\`\`
          ${REASON}
          \`\`\`"

          EXISTING=$(gh issue list --state open --label "autobump-failed" --search "[autobump-failed] ${PKG} in:title" --json number,title --jq '.[0]')
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            NUM=$(echo "$EXISTING" | jq -r '.number')
            CUR_TITLE=$(echo "$EXISTING" | jq -r '.title')
            if [ "$CUR_TITLE" != "$TITLE" ]; then
              gh issue edit "$NUM" --title "$TITLE"
              gh issue comment "$NUM" --body "$BODY"
            else
              echo "Failure issue #$NUM already tracks ${PKG} ${NEW_VER}, skipping duplicate comment."
            fi
          else
            gh issue create --title "$TITLE" --label "autobump-failed" --body "$BODY"
          fi

          exit 1
