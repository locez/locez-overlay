name: Auto-Bump Packages

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      package:
        description: "Optional single package to check/bump (e.g. media-sound/cider)"
        required: false
        default: ""

concurrency:
  group: autobump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      issues: write
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_updates: ${{ steps.detect.outputs.has_updates }}
      arm64_matrix: ${{ steps.detect.outputs.arm64_matrix }}
      has_arm64_updates: ${{ steps.detect.outputs.has_arm64_updates }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install nvchecker in isolated venv
        run: |
          python3 -m venv "${{ runner.temp }}/nv-venv"
          "${{ runner.temp }}/nv-venv/bin/pip" install --quiet --upgrade "nvchecker>=2.15,<3"
          echo "${{ runner.temp }}/nv-venv/bin" >> "$GITHUB_PATH"

      - name: Detect outdated packages & ZFS unlock signals
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PKG: ${{ inputs.package }}
        run: |
          ARGS=(detect --result-file "${{ runner.temp }}/detect.json")
          if [ -n "$INPUT_PKG" ]; then
            ARGS+=(--only "$INPUT_PKG")
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            # On Tue-Sun scheduled runs, throttle versions that already have an open failure issue
            # and skip weekly-cadence packages; Mondays and manual runs always check everything.
            ARGS+=(--throttle-failed --skip-weekly)
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py "${ARGS[@]}"

          UPDATES=$(jq -c '.updates' "${{ runner.temp }}/detect.json")
          COUNT=$(jq '.updates | length' "${{ runner.temp }}/detect.json")
          ARM64_UPDATES=$(jq -c '[.updates[] | select(.arm64 == true)]' "${{ runner.temp }}/detect.json")
          ARM64_COUNT=$(echo "$ARM64_UPDATES" | jq 'length')
          echo "matrix=$UPDATES" >> "$GITHUB_OUTPUT"
          echo "arm64_matrix=$ARM64_UPDATES" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$ARM64_COUNT" -gt 0 ]; then
            echo "has_arm64_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_arm64_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify on detection errors or ZFS kernel unlock
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f "${{ runner.temp }}/detect.json" ] || exit 0
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -c '.zfs_alerts[]?' "${{ runner.temp }}/detect.json" | while read -r item; do
            PKG=$(echo "$item" | jq -r '.pkg')
            MSG=$(echo "$item" | jq -r '.message')
            PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py notify \
              --event zfs_unlocked \
              --pkg "$PKG" \
              --title "OpenZFS stable now supports newer kernel series" \
              --detail "$MSG" \
              --run-url "$RUN_URL"
          done

          ERR_COUNT=$(jq '.errors | length' "${{ runner.temp }}/detect.json")
          if [ "$ERR_COUNT" -gt 0 ]; then
            ERR_TEXT=$(jq -r '.errors[] | "- \(.pkg): \(.error)"' "${{ runner.temp }}/detect.json")
            PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py notify \
              --event failed \
              --pkg "overlay/detect" \
              --title "version detection error" \
              --detail "$ERR_TEXT" \
              --run-url "$RUN_URL"
          fi

  bump:
    needs: detect
    if: needs.detect.outputs.has_updates == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Go (for go-vendor strategy)
        if: matrix.strategy == 'go-vendor'
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Set up Rust / pycargoebuild (for rust strategies)
        if: matrix.strategy == 'rust-vendor' || matrix.strategy == 'rust-crates'
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          if [ "${{ matrix.strategy }}" = "rust-crates" ]; then
            pip install --quiet pycargoebuild
          fi

      - name: Bump ebuild & Manifest
        id: bump
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISTFILES_TOKEN: ${{ secrets.DISTFILES_TOKEN }}
        run: |
          mkdir -p "${{ runner.temp }}/bump-distfiles"
          PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py bump \
            --pkg "${{ matrix.pkg }}" \
            --target "${{ matrix.upstream_ver }}" \
            --upload-vendor \
            --distdir "${{ runner.temp }}/bump-distfiles" \
            --result-file "${{ runner.temp }}/bump-result.json" || true

          STATUS=$(jq -r '.status // "failed"' "${{ runner.temp }}/bump-result.json")
          TARGET=$(jq -r '.target_ver // "${{ matrix.upstream_ver }}"' "${{ runner.temp }}/bump-result.json")
          POLICY=$(jq -r '.policy // "pr-only"' "${{ runner.temp }}/bump-result.json")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "target_ver=$TARGET" >> "$GITHUB_OUTPUT"
          echo "policy=$POLICY" >> "$GITHUB_OUTPUT"

      - name: Run pkgcheck gate
        id: pkgcheck
        if: steps.bump.outputs.status == 'bumped'
        continue-on-error: true
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: --exit error ${{ matrix.pkg }}

      - name: Run Gentoo stage3 build & integration smoke test
        id: build_test
        if: steps.bump.outputs.status == 'bumped' && steps.pkgcheck.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/gentoo-build-test
        with:
          package: ${{ matrix.pkg }}
          log-dir: ${{ runner.temp }}/build-logs
          distdir: ${{ runner.temp }}/bump-distfiles

      - name: Create PR and apply merge policy
        id: pr
        if: steps.bump.outputs.status == 'bumped' && steps.pkgcheck.outcome == 'success' && steps.build_test.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PKG="${{ matrix.pkg }}"
          SLUG="${{ matrix.slug }}"
          LOCAL_VER="${{ matrix.local_ver }}"
          NEW_VER="${{ steps.bump.outputs.target_ver }}"
          POLICY="${{ steps.bump.outputs.policy }}"
          BRANCH="autobump/${SLUG}"
          BASE=$(python3 .github/autobump/main.py config-info | jq -r '.overlay.base_branch')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A "$PKG"
          if git diff --cached --quiet; then
            echo "No changes to commit for $PKG"
            exit 0
          fi

          git commit -m "${PKG}: bump ${LOCAL_VER} -> ${NEW_VER}"
          git push --force origin "$BRANCH"

          PR_TITLE="${PKG}: bump ${LOCAL_VER} -> ${NEW_VER}"
          PR_BODY="Automated bump for \`${PKG}\` (\`${LOCAL_VER}\` -> \`${NEW_VER}\`).

          - Thin Manifest updated (BLAKE2B + SHA512)
          - \`pkgcheck scan --exit error ${PKG}\` passed
          - Gentoo \`stage3\` build & integration smoke test passed
          - Workflow run: ${RUN_URL}"

          PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUM" ]; then
            gh pr edit "$PR_NUM" --title "$PR_TITLE" --body "$PR_BODY"
            PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUM}"
          else
            PR_URL=$(gh pr create --base "$BASE" --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY")
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          fi

          if [ "${{ matrix.arm64 }}" = "true" ]; then
            echo "Deferring auto-merge for $PKG until ARM64 verification succeeds."
            jq -n \
              --arg pr_num "$PR_NUM" \
              --arg pr_url "$PR_URL" \
              --arg branch "$BRANCH" \
              --arg base "$BASE" \
              --arg local_ver "$LOCAL_VER" \
              --arg new_ver "$NEW_VER" \
              --arg policy "$POLICY" \
              '{pr_num: $pr_num, pr_url: $pr_url, branch: $branch, base: $base, local_ver: $local_ver, new_ver: $new_ver, policy: $policy}' \
              > "${{ runner.temp }}/arm64-ready.json"
            echo "arm64_ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$POLICY" = "auto-merge" ]; then
            MERGED=false
            for attempt in 1 2 3 4 5; do
              if gh pr merge "$PR_NUM" --squash --delete-branch; then
                MERGED=true
                break
              fi
              echo "Merge attempt $attempt failed for PR #$PR_NUM, rebasing onto origin/$BASE..."
              sleep $(( attempt * 3 ))
              git fetch origin "$BASE"
              git rebase "origin/$BASE"
              git push --force origin "$BRANCH"
            done
            if [ "$MERGED" != "true" ]; then
              echo "Failed to auto-merge PR #$PR_NUM after 5 attempts" >&2
              exit 1
            fi
            PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py close-issue \
              --pkg "$PKG" \
              --comment "Resolved and auto-merged via PR #${PR_NUM} (\`${NEW_VER}\`)."
            PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py notify \
              --event merged \
              --pkg "$PKG" \
              --title "${LOCAL_VER} -> ${NEW_VER} merged" \
              --pr-url "$PR_URL" \
              --run-url "$RUN_URL"
          fi

      - name: Upload ARM64 handoff metadata
        if: steps.pr.outputs.arm64_ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: arm64-ready-${{ matrix.slug }}
          path: ${{ runner.temp }}/arm64-ready.json
          retention-days: 1

      - name: Collect FailureContext & notify (GitHub + Telegram)
        id: on_fail
        if: steps.bump.outputs.status == 'failed' || (steps.bump.outputs.status == 'bumped' && (steps.pkgcheck.outcome != 'success' || steps.build_test.outcome != 'success' || steps.pr.outcome != 'success'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PKG="${{ matrix.pkg }}"
          LOCAL_VER="${{ matrix.local_ver }}"
          NEW_VER="${{ steps.bump.outputs.target_ver }}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "${{ steps.bump.outputs.status }}" = "failed" ]; then
            STAGE="bump"
            SUMMARY=$(jq -r '.message // "Unknown bump error"' "${{ runner.temp }}/bump-result.json")
          elif [ "${{ steps.pkgcheck.outcome }}" != "success" ]; then
            STAGE="pkgcheck"
            SUMMARY="pkgcheck scan --exit error failed for ${PKG} ${NEW_VER}"
          elif [ "${{ steps.build_test.outcome }}" != "success" ]; then
            STAGE="build-test"
            SUMMARY="Gentoo stage3 build or smoke_test failed for ${PKG} ${NEW_VER}"
          else
            STAGE="pr-merge"
            SUMMARY="Failed to create or auto-merge PR for ${PKG} ${NEW_VER}"
          fi

          LOG_ARGS=()
          [ -f "${{ runner.temp }}/build-logs/console.log" ] && LOG_ARGS+=(--log "console=${{ runner.temp }}/build-logs/console.log")
          [ -f "${{ runner.temp }}/build-logs/build.log" ] && LOG_ARGS+=(--log "portage_build=${{ runner.temp }}/build-logs/build.log")

          PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py collect-context \
            --pkg "$PKG" \
            --stage "$STAGE" \
            --local-ver "$LOCAL_VER" \
            --target-ver "$NEW_VER" \
            --summary "$SUMMARY" \
            --run-url "$RUN_URL" \
            "${LOG_ARGS[@]}" \
            --out "${{ runner.temp }}/failure-context.json"

          PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py notify \
            --event failed \
            --pkg "$PKG" \
            --title "${LOCAL_VER} -> ${NEW_VER} (${STAGE} failed)" \
            --detail "$SUMMARY" \
            --log-file "${{ runner.temp }}/build-logs/build.log" \
            --log-file "${{ runner.temp }}/build-logs/console.log" \
            --run-url "$RUN_URL"

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Upload FailureContext artifact
        if: steps.on_fail.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: failure-context-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/failure-context.json
            ${{ runner.temp }}/build-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Attempt pluggable AI repair (Draft PR only, never auto-merge)
        id: ai_run
        if: steps.on_fail.outcome == 'success'
        continue-on-error: true
        env:
          AI_REPAIR_CMD: ${{ secrets.AI_REPAIR_CMD }}
          AI_REPAIR_API_KEY: ${{ secrets.AI_REPAIR_API_KEY }}
        run: |
          if [ -z "${AI_REPAIR_CMD:-}" ]; then
            echo "status=disabled" >> "$GITHUB_OUTPUT"
            echo "AI_REPAIR_CMD secret not set; skipping automatic AI repair."
            exit 0
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py ai-repair \
            --context "${{ runner.temp }}/failure-context.json" \
            --result-file "${{ runner.temp }}/ai-result.json" || true
          STATUS=$(jq -r '.status // "failed"' "${{ runner.temp }}/ai-result.json")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Verify AI patch with pkgcheck
        id: ai_pkgcheck
        if: steps.ai_run.outputs.status == 'patched'
        continue-on-error: true
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: --exit error ${{ matrix.pkg }}

      - name: Verify AI patch in Gentoo stage3
        id: ai_build
        if: steps.ai_run.outputs.status == 'patched' && steps.ai_pkgcheck.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/gentoo-build-test
        with:
          package: ${{ matrix.pkg }}
          log-dir: ${{ runner.temp }}/ai-build-logs
          distdir: ${{ runner.temp }}/bump-distfiles

      - name: Open AI Draft PR & notify
        if: steps.ai_run.outputs.status == 'patched' && steps.ai_pkgcheck.outcome == 'success' && steps.ai_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PKG="${{ matrix.pkg }}"
          SLUG="${{ matrix.slug }}"
          NEW_VER="${{ steps.bump.outputs.target_ver }}"
          BASE=$(python3 .github/autobump/main.py config-info | jq -r '.overlay.base_branch')
          BRANCH="ai-fix/${SLUG}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A "$PKG" licenses/ 2>/dev/null || git add -A "$PKG"
          git commit -m "${PKG}: AI-assisted repair for ${NEW_VER}"
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr create --draft --base "$BASE" --head "$BRANCH" \
            --title "[AI Draft] ${PKG}: repair ${NEW_VER}" \
            --body "AI-assisted repair candidate for \`${PKG}\` (\`${NEW_VER}\`).

          - Guardrails verified (only package files modified)
          - \`pkgcheck\` & Gentoo \`stage3\` build/smoke test passed
          - **Manual review required** (AI PRs are never auto-merged)
          - Workflow run: ${RUN_URL}")

          python3 .github/autobump/main.py notify \
            --event ai_draft_pr \
            --pkg "$PKG" \
            --title "AI Draft PR ready for ${NEW_VER}" \
            --pr-url "$PR_URL" \
            --run-url "$RUN_URL"

      - name: Mark failed job
        if: steps.on_fail.outcome == 'success'
        run: exit 1

  verify-arm64-and-merge:
    name: verify-arm64 (${{ matrix.pkg }})
    needs: [detect, bump]
    if: always() && needs.detect.outputs.has_arm64_updates == 'true'
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.arm64_matrix) }}

    steps:
      - name: Download ARM64 handoff metadata from x64 bump job
        id: handoff
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: arm64-ready-${{ matrix.slug }}
          path: ${{ runner.temp }}/arm64-handoff

      - name: Parse ARM64 handoff metadata
        id: meta
        if: steps.handoff.outcome == 'success'
        run: |
          FILE="${{ runner.temp }}/arm64-handoff/arm64-ready.json"
          if [ ! -f "$FILE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "pr_num=$(jq -r '.pr_num' "$FILE")" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r '.pr_url' "$FILE")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.branch' "$FILE")" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r '.base' "$FILE")" >> "$GITHUB_OUTPUT"
          echo "local_ver=$(jq -r '.local_ver' "$FILE")" >> "$GITHUB_OUTPUT"
          echo "new_ver=$(jq -r '.new_ver' "$FILE")" >> "$GITHUB_OUTPUT"
          echo "policy=$(jq -r '.policy' "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Checkout bumped PR branch on ARM64 runner
        if: steps.meta.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.branch }}
          fetch-depth: 0

      - name: Verify bumped package on Gentoo stage3 (ARM64)
        id: arm64_build
        if: steps.meta.outputs.ready == 'true'
        continue-on-error: true
        uses: ./.github/actions/gentoo-build-test
        with:
          package: ${{ matrix.pkg }}
          log-dir: ${{ runner.temp }}/arm64-build-logs

      - name: Auto-merge PR after both X64 and ARM64 pass
        if: steps.meta.outputs.ready == 'true' && steps.arm64_build.outcome == 'success' && steps.meta.outputs.policy == 'auto-merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PKG="${{ matrix.pkg }}"
          PR_NUM="${{ steps.meta.outputs.pr_num }}"
          PR_URL="${{ steps.meta.outputs.pr_url }}"
          BRANCH="${{ steps.meta.outputs.branch }}"
          BASE="${{ steps.meta.outputs.base }}"
          LOCAL_VER="${{ steps.meta.outputs.local_ver }}"
          NEW_VER="${{ steps.meta.outputs.new_ver }}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MERGED=false
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_NUM" --squash --delete-branch; then
              MERGED=true
              break
            fi
            echo "Merge attempt $attempt failed for PR #$PR_NUM, rebasing onto origin/$BASE..."
            sleep $(( attempt * 3 ))
            git fetch origin "$BASE"
            git rebase "origin/$BASE"
            git push --force origin "$BRANCH"
          done
          if [ "$MERGED" != "true" ]; then
            echo "Failed to auto-merge PR #$PR_NUM after 5 attempts" >&2
            exit 1
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py close-issue \
            --pkg "$PKG" \
            --comment "Resolved and auto-merged via PR #${PR_NUM} (\`${NEW_VER}\`, verified on X64 + ARM64)."
          PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py notify \
            --event merged \
            --pkg "$PKG" \
            --title "${LOCAL_VER} -> ${NEW_VER} merged (X64 + ARM64)" \
            --pr-url "$PR_URL" \
            --run-url "$RUN_URL"

      - name: Upload ARM64 build logs on failure
        if: steps.meta.outputs.ready == 'true' && steps.arm64_build.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: arm64-build-logs-${{ matrix.slug }}
          path: ${{ runner.temp }}/arm64-build-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on ARM64 verification failure
        if: steps.meta.outputs.ready == 'true' && steps.arm64_build.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PKG="${{ matrix.pkg }}"
          LOCAL_VER="${{ steps.meta.outputs.local_ver }}"
          NEW_VER="${{ steps.meta.outputs.new_ver }}"
          PR_URL="${{ steps.meta.outputs.pr_url }}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py notify \
            --event failed \
            --pkg "$PKG" \
            --title "${LOCAL_VER} -> ${NEW_VER} (arm64 build-test failed)" \
            --detail "X64 passed (PR ${PR_URL} left open), but ARM64 Gentoo stage3 build/smoke test failed." \
            --log-file "${{ runner.temp }}/arm64-build-logs/build.log" \
            --log-file "${{ runner.temp }}/arm64-build-logs/console.log" \
            --run-url "$RUN_URL"
          exit 1
