name: Auto-Bump Packages

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      package:
        description: "Optional single package to check/bump (e.g. media-sound/cider)"
        required: false
        default: ""

concurrency:
  group: autobump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_updates: ${{ steps.detect.outputs.has_updates }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install nvchecker
        run: pip install --upgrade nvchecker

      - name: Detect outdated packages & ZFS unlock signals
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="detect --result-file /tmp/detect.json"
          if [ -n "${{ inputs.package }}" ]; then
            ARGS="$ARGS --only ${{ inputs.package }}"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            # On Tue-Sun scheduled runs, throttle versions that already have an open failure issue;
            # Mondays and manual runs always retry everything.
            ARGS="$ARGS --throttle-failed"
          fi
          python3 .github/autobump/main.py $ARGS

          UPDATES=$(jq -c '.updates' /tmp/detect.json)
          COUNT=$(jq '.updates | length' /tmp/detect.json)
          echo "matrix=$UPDATES" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify on detection errors or ZFS kernel unlock
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f /tmp/detect.json ] || exit 0
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -c '.zfs_alerts[]?' /tmp/detect.json | while read -r item; do
            PKG=$(echo "$item" | jq -r '.pkg')
            MSG=$(echo "$item" | jq -r '.message')
            python3 .github/autobump/main.py notify \
              --event zfs_unlocked \
              --pkg "$PKG" \
              --title "OpenZFS stable now supports newer kernel series" \
              --detail "$MSG" \
              --run-url "$RUN_URL"
          done

          ERR_COUNT=$(jq '.errors | length' /tmp/detect.json)
          if [ "$ERR_COUNT" -gt 0 ]; then
            ERR_TEXT=$(jq -r '.errors[] | "- \(.pkg): \(.error)"' /tmp/detect.json)
            python3 .github/autobump/main.py notify \
              --event failed \
              --pkg "overlay/detect" \
              --title "version detection error" \
              --detail "$ERR_TEXT" \
              --run-url "$RUN_URL"
          fi

  bump:
    needs: detect
    if: needs.detect.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Go (for go-vendor strategy)
        if: matrix.strategy == 'go-vendor'
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Set up Rust / pycargoebuild (for rust strategies)
        if: matrix.strategy == 'rust-vendor' || matrix.strategy == 'rust-crates'
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          if [ "${{ matrix.strategy }}" = "rust-crates" ]; then
            pip install --quiet pycargoebuild
          fi

      - name: Bump ebuild & Manifest
        id: bump
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISTFILES_TOKEN: ${{ secrets.DISTFILES_TOKEN }}
        run: |
          mkdir -p /tmp/bump-distfiles
          python3 .github/autobump/main.py bump \
            --pkg "${{ matrix.pkg }}" \
            --target "${{ matrix.upstream_ver }}" \
            --upload-vendor \
            --distdir /tmp/bump-distfiles \
            --result-file /tmp/bump-result.json || true

          STATUS=$(jq -r '.status // "failed"' /tmp/bump-result.json)
          TARGET=$(jq -r '.target_ver // "${{ matrix.upstream_ver }}"' /tmp/bump-result.json)
          POLICY=$(jq -r '.policy // "pr-only"' /tmp/bump-result.json)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "target_ver=$TARGET" >> "$GITHUB_OUTPUT"
          echo "policy=$POLICY" >> "$GITHUB_OUTPUT"

      - name: Run pkgcheck gate
        id: pkgcheck
        if: steps.bump.outputs.status == 'bumped'
        continue-on-error: true
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: --exit error ${{ matrix.pkg }}

      - name: Run Gentoo stage3 build & integration smoke test
        id: build_test
        if: steps.bump.outputs.status == 'bumped' && steps.pkgcheck.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/gentoo-build-test
        with:
          package: ${{ matrix.pkg }}
          log-dir: /tmp/build-logs
          distdir: /tmp/bump-distfiles

      - name: Create PR and apply merge policy
        id: pr
        if: steps.bump.outputs.status == 'bumped' && steps.pkgcheck.outcome == 'success' && steps.build_test.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PKG="${{ matrix.pkg }}"
          SLUG="${{ matrix.slug }}"
          LOCAL_VER="${{ matrix.local_ver }}"
          NEW_VER="${{ steps.bump.outputs.target_ver }}"
          POLICY="${{ steps.bump.outputs.policy }}"
          BRANCH="autobump/${SLUG}"
          BASE=$(python3 .github/autobump/main.py config-info | jq -r '.overlay.base_branch')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A "$PKG"
          if git diff --cached --quiet; then
            echo "No changes to commit for $PKG"
            exit 0
          fi

          git commit -m "${PKG}: bump ${LOCAL_VER} -> ${NEW_VER}"
          git push --force origin "$BRANCH"

          PR_TITLE="${PKG}: bump ${LOCAL_VER} -> ${NEW_VER}"
          PR_BODY="Automated bump for \`${PKG}\` (\`${LOCAL_VER}\` -> \`${NEW_VER}\`).

          - Thin Manifest updated (BLAKE2B + SHA512)
          - \`pkgcheck scan --exit error ${PKG}\` passed
          - Gentoo \`stage3\` build & integration smoke test passed
          - Workflow run: ${RUN_URL}"

          PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUM" ]; then
            gh pr edit "$PR_NUM" --title "$PR_TITLE" --body "$PR_BODY"
            PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUM}"
          else
            PR_URL=$(gh pr create --base "$BASE" --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY")
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          fi

          if [ "$POLICY" = "auto-merge" ]; then
            MERGED=false
            for attempt in 1 2 3 4 5; do
              if gh pr merge "$PR_NUM" --squash --delete-branch; then
                MERGED=true
                break
              fi
              echo "Merge attempt $attempt failed for PR #$PR_NUM, rebasing onto origin/$BASE..."
              sleep $(( attempt * 3 ))
              git fetch origin "$BASE"
              git rebase "origin/$BASE"
              git push --force origin "$BRANCH"
            done
            if [ "$MERGED" != "true" ]; then
              echo "Failed to auto-merge PR #$PR_NUM after 5 attempts" >&2
              exit 1
            fi
            python3 .github/autobump/main.py close-issue \
              --pkg "$PKG" \
              --comment "Resolved and auto-merged via PR #${PR_NUM} (\`${NEW_VER}\`)."
            python3 .github/autobump/main.py notify \
              --event merged \
              --pkg "$PKG" \
              --title "${LOCAL_VER} -> ${NEW_VER} merged" \
              --pr-url "$PR_URL" \
              --run-url "$RUN_URL"
          fi

      - name: Collect FailureContext & notify (GitHub + Telegram)
        id: on_fail
        if: steps.bump.outputs.status == 'failed' || (steps.bump.outputs.status == 'bumped' && (steps.pkgcheck.outcome != 'success' || steps.build_test.outcome != 'success' || steps.pr.outcome != 'success'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PKG="${{ matrix.pkg }}"
          LOCAL_VER="${{ matrix.local_ver }}"
          NEW_VER="${{ steps.bump.outputs.target_ver }}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "${{ steps.bump.outputs.status }}" = "failed" ]; then
            STAGE="bump"
            SUMMARY=$(jq -r '.message // "Unknown bump error"' /tmp/bump-result.json)
          elif [ "${{ steps.pkgcheck.outcome }}" != "success" ]; then
            STAGE="pkgcheck"
            SUMMARY="pkgcheck scan --exit error failed for ${PKG} ${NEW_VER}"
          elif [ "${{ steps.build_test.outcome }}" != "success" ]; then
            STAGE="build-test"
            SUMMARY="Gentoo stage3 build or smoke_test failed for ${PKG} ${NEW_VER}"
          else
            STAGE="pr-merge"
            SUMMARY="Failed to create or auto-merge PR for ${PKG} ${NEW_VER}"
          fi

          LOG_ARGS=()
          [ -f /tmp/build-logs/console.log ] && LOG_ARGS+=(--log "console=/tmp/build-logs/console.log")
          [ -f /tmp/build-logs/build.log ] && LOG_ARGS+=(--log "portage_build=/tmp/build-logs/build.log")

          python3 .github/autobump/main.py collect-context \
            --pkg "$PKG" \
            --stage "$STAGE" \
            --local-ver "$LOCAL_VER" \
            --target-ver "$NEW_VER" \
            --summary "$SUMMARY" \
            --run-url "$RUN_URL" \
            "${LOG_ARGS[@]}" \
            --out /tmp/failure-context.json

          python3 .github/autobump/main.py notify \
            --event failed \
            --pkg "$PKG" \
            --title "${LOCAL_VER} -> ${NEW_VER} (${STAGE} failed)" \
            --detail "$SUMMARY" \
            --log-file /tmp/build-logs/build.log \
            --log-file /tmp/build-logs/console.log \
            --run-url "$RUN_URL"

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Upload FailureContext artifact
        if: steps.on_fail.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: failure-context-${{ matrix.slug }}
          path: |
            /tmp/failure-context.json
            /tmp/build-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Attempt pluggable AI repair (Draft PR only, never auto-merge)
        id: ai_run
        if: steps.on_fail.outcome == 'success'
        continue-on-error: true
        env:
          AI_REPAIR_CMD: ${{ secrets.AI_REPAIR_CMD }}
          AI_REPAIR_API_KEY: ${{ secrets.AI_REPAIR_API_KEY }}
        run: |
          if [ -z "${AI_REPAIR_CMD:-}" ]; then
            echo "status=disabled" >> "$GITHUB_OUTPUT"
            echo "AI_REPAIR_CMD secret not set; skipping automatic AI repair."
            exit 0
          fi
          python3 .github/autobump/main.py ai-repair \
            --context /tmp/failure-context.json \
            --result-file /tmp/ai-result.json || true
          STATUS=$(jq -r '.status // "failed"' /tmp/ai-result.json)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Verify AI patch with pkgcheck
        id: ai_pkgcheck
        if: steps.ai_run.outputs.status == 'patched'
        continue-on-error: true
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: --exit error ${{ matrix.pkg }}

      - name: Verify AI patch in Gentoo stage3
        id: ai_build
        if: steps.ai_run.outputs.status == 'patched' && steps.ai_pkgcheck.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/gentoo-build-test
        with:
          package: ${{ matrix.pkg }}
          log-dir: /tmp/ai-build-logs
          distdir: /tmp/bump-distfiles

      - name: Open AI Draft PR & notify
        if: steps.ai_run.outputs.status == 'patched' && steps.ai_pkgcheck.outcome == 'success' && steps.ai_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PKG="${{ matrix.pkg }}"
          SLUG="${{ matrix.slug }}"
          NEW_VER="${{ steps.bump.outputs.target_ver }}"
          BASE=$(python3 .github/autobump/main.py config-info | jq -r '.overlay.base_branch')
          BRANCH="ai-fix/${SLUG}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A "$PKG" licenses/ 2>/dev/null || git add -A "$PKG"
          git commit -m "${PKG}: AI-assisted repair for ${NEW_VER}"
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr create --draft --base "$BASE" --head "$BRANCH" \
            --title "[AI Draft] ${PKG}: repair ${NEW_VER}" \
            --body "AI-assisted repair candidate for \`${PKG}\` (\`${NEW_VER}\`).

          - Guardrails verified (only package files modified)
          - \`pkgcheck\` & Gentoo \`stage3\` build/smoke test passed
          - **Manual review required** (AI PRs are never auto-merged)
          - Workflow run: ${RUN_URL}")

          python3 .github/autobump/main.py notify \
            --event ai_draft_pr \
            --pkg "$PKG" \
            --title "AI Draft PR ready for ${NEW_VER}" \
            --pr-url "$PR_URL" \
            --run-url "$RUN_URL"

      - name: Mark failed job
        if: steps.on_fail.outcome == 'success'
        run: exit 1
