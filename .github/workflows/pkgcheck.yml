name: Pkgcheck
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run autobump engine unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/autobump/tests -v

      - name: Run pkgcheck
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: --net
