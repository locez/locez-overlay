name: Gentoo Build & Integration Test

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "README.md"
      - "**.md"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build & smoke-test (e.g. dev-python/pure-protobuf)"
        required: true
      live:
        description: "Test 9999 live ebuild"
        type: boolean
        default: false
      runner:
        description: "Runner target for stage3 build-test"
        type: choice
        default: "ubuntu-latest"
        options:
          - "ubuntu-latest"
          - "self-hosted-x64"
          - "self-hosted-arm64"
          - "self-hosted-both"
  workflow_call:
    inputs:
      packages_json:
        description: 'JSON array of {"pkg":"cat/pn","slug":"cat-pn"}'
        required: true
        type: string
      live:
        description: "Test 9999 live ebuilds"
        required: false
        type: boolean
        default: false

jobs:
  plan:
    if: >
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'autobump/') &&
       !startsWith(github.head_ref, 'python-compat/'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_packages: ${{ steps.plan.outputs.has_packages }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine packages to build-test
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            PKGS='${{ inputs.packages_json }}'
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PKG="${{ inputs.package }}"
            SLUG="${PKG//\//-}"
            PKGS="[{\"pkg\":\"${PKG}\",\"slug\":\"${SLUG}\"}]"
          else
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
            PKGS=$(python3 .github/autobump/main.py changed-packages --base "origin/${{ github.base_ref }}")
          fi
          RUNNER_CHOICE="${{ inputs.runner }}"
          case "$RUNNER_CHOICE" in
            self-hosted-x64)
              RUNNERS_JSON='[{"arch":"x64","runner":["self-hosted","Linux","X64"]}]'
              ;;
            self-hosted-arm64)
              RUNNERS_JSON='[{"arch":"arm64","runner":["self-hosted","Linux","ARM64"]}]'
              ;;
            self-hosted-both)
              RUNNERS_JSON='[{"arch":"x64","runner":["self-hosted","Linux","X64"]},{"arch":"arm64","runner":["self-hosted","Linux","ARM64"]}]'
              ;;
            *)
              RUNNERS_JSON='[{"arch":"x64","runner":"ubuntu-latest"}]'
              ;;
          esac
          COMPACT=$(echo "$PKGS" | jq -c --argjson runners "$RUNNERS_JSON" '[.[] as $p | $runners[] as $r | ($p + $r)]')
          COUNT=$(echo "$COMPACT" | jq 'length')
          PKG_ARGS=$(echo "$PKGS" | jq -r '.[].pkg' | tr '\n' ' ')
          echo "matrix=$COMPACT" >> "$GITHUB_OUTPUT"
          echo "pkg_args=$PKG_ARGS" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pkgcheck on target packages
        if: steps.plan.outputs.has_packages == 'true'
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: --exit error ${{ steps.plan.outputs.pkg_args }}

  build-test:
    name: build-test (${{ matrix.pkg }}, ${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.has_packages == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Build & smoke-test in Gentoo stage3
        uses: ./.github/actions/gentoo-build-test
        with:
          package: ${{ matrix.pkg }}
          live: ${{ inputs.live }}
          log-dir: ${{ runner.temp }}/build-logs

      - name: Upload Portage build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.slug }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/build-logs
          if-no-files-found: ignore
          retention-days: 7
