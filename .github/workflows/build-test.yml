name: Gentoo Build & Integration Test

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "README.md"
      - "**.md"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "README.md"
      - "**.md"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build & smoke-test (e.g. dev-python/pure-protobuf)"
        required: true
      live:
        description: "Test 9999 live ebuild"
        type: boolean
        default: false
      runner:
        description: "Runner target for stage3 build-test (auto = self-hosted X64/ARM64 matching package KEYWORDS)"
        type: choice
        default: "auto"
        options:
          - "auto"
          - "self-hosted-x64"
          - "self-hosted-arm64"
          - "self-hosted-both"
          - "ubuntu-latest"
  workflow_call:
    inputs:
      packages_json:
        description: 'JSON array of {"pkg":"cat/pn","slug":"cat-pn"}'
        required: true
        type: string
      live:
        description: "Test 9999 live ebuilds"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: >
      (github.event_name != 'pull_request' ||
       (!startsWith(github.head_ref, 'autobump/') &&
        !startsWith(github.head_ref, 'python-compat/'))) &&
      (github.event_name != 'push' ||
       github.actor != 'github-actions[bot]')
    # Trusted events (push/workflow_dispatch/workflow_call/same-repo PR) run on self-hosted;
    # untrusted external fork PRs always stay on ephemeral GitHub-hosted runners.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJson('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_packages: ${{ steps.plan.outputs.has_packages }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine packages & safe runner matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          RUNNER_CHOICE: ${{ inputs.runner }}
          INPUT_PKG: ${{ inputs.package }}
          INPUT_LIVE: ${{ inputs.live }}
          INPUT_PACKAGES_JSON: ${{ inputs.packages_json }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_call" ]; then
            PKGS="$INPUT_PACKAGES_JSON"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PKG="$INPUT_PKG"
            SLUG="${PKG//\//-}"
            LIVE_FLAG=""
            [ "$INPUT_LIVE" = "true" ] && LIVE_FLAG="--live"
            ARCHES=$(PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py package-arches --pkg "$PKG" $LIVE_FLAG | jq -c '.arches')
            PKGS=$(jq -cn --arg pkg "$PKG" --arg slug "$SLUG" --argjson arches "$ARCHES" '[{pkg: $pkg, slug: $slug, arches: $arches}]')
          elif [ "$EVENT_NAME" = "push" ]; then
            BEFORE="$PUSH_BEFORE"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="HEAD~1"
            fi
            PKGS=$(PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py changed-packages --base "$BEFORE")
          else
            git fetch origin "$PR_BASE_REF" --depth=1 || true
            PKGS=$(PYTHONDONTWRITEBYTECODE=1 python3 .github/autobump/main.py changed-packages --base "origin/${PR_BASE_REF}")
          fi

          if [ "$IS_TRUSTED" != "true" ]; then
            # Untrusted external fork PR: never schedule on self-hosted runners
            COMPACT=$(echo "$PKGS" | jq -c '
              [.[] as $p | ($p.arches // ["x64"])[] as $a |
                {
                  pkg: $p.pkg,
                  slug: $p.slug,
                  arch: $a,
                  runner: (if $a == "arm64" then "ubuntu-24.04-arm" else "ubuntu-latest" end)
                }
              ]')
          else
            case "${RUNNER_CHOICE:-auto}" in
              self-hosted-x64)
                COMPACT=$(echo "$PKGS" | jq -c '[.[] | {pkg, slug, arch: "x64", runner: ["self-hosted","Linux","X64"]}]')
                ;;
              self-hosted-arm64)
                COMPACT=$(echo "$PKGS" | jq -c '[.[] | {pkg, slug, arch: "arm64", runner: ["self-hosted","Linux","ARM64"]}]')
                ;;
              self-hosted-both)
                COMPACT=$(echo "$PKGS" | jq -c '[.[] as $p | (
                    {pkg: $p.pkg, slug: $p.slug, arch: "x64", runner: ["self-hosted","Linux","X64"]},
                    {pkg: $p.pkg, slug: $p.slug, arch: "arm64", runner: ["self-hosted","Linux","ARM64"]}
                  )]')
                ;;
              ubuntu-latest)
                COMPACT=$(echo "$PKGS" | jq -c '[.[] | {pkg, slug, arch: "x64", runner: "ubuntu-latest"}]')
                ;;
              *)
                # auto: schedule each package on self-hosted X64 and/or ARM64 matching its KEYWORDS
                COMPACT=$(echo "$PKGS" | jq -c '
                  [.[] as $p | ($p.arches // ["x64"])[] as $a |
                    {
                      pkg: $p.pkg,
                      slug: $p.slug,
                      arch: $a,
                      runner: (if $a == "arm64" then ["self-hosted","Linux","ARM64"] else ["self-hosted","Linux","X64"] end)
                    }
                  ]')
                ;;
            esac
          fi

          COUNT=$(echo "$COMPACT" | jq 'length')
          PKG_ARGS=$(echo "$PKGS" | jq -r '.[].pkg' | tr '\n' ' ')
          echo "matrix=$COMPACT" >> "$GITHUB_OUTPUT"
          echo "pkg_args=$PKG_ARGS" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pkgcheck on target packages
        if: steps.plan.outputs.has_packages == 'true'
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: --exit error ${{ steps.plan.outputs.pkg_args }}

  build-test:
    name: build-test (${{ matrix.pkg }}, ${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.has_packages == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Build & smoke-test in Gentoo stage3
        uses: ./.github/actions/gentoo-build-test
        with:
          package: ${{ matrix.pkg }}
          live: ${{ inputs.live }}
          log-dir: ${{ runner.temp }}/build-logs

      - name: Upload Portage build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.slug }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/build-logs
          if-no-files-found: ignore
          retention-days: 7
