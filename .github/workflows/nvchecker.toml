[__config__]
# Version records file to be committed by GitHub Actions
oldver = "../old_versions.json"
newver = "../new_versions.json"

["app-emulation/dwproton-bin"]
source = "gitea"
gitea = "dawn-winery/dwproton"
host = "dawn.wine"
use_latest_release = true
prefix = "dwproton-"
from_pattern = "-([0-9]+)$"
to_pattern = "_p\\1"

["app-emulation/proton-ge-bin"]
source = "github"
github = "GloriousEggroll/proton-ge-custom"
use_latest_release = true
prefix = "GE-Proton"
from_pattern = "^([0-9]+)-([0-9]+)$"
to_pattern = "\\1.\\2"

["dev-python/pure-protobuf"]
source = "pypi"
pypi = "pure-protobuf"

["dev-python/qasync"]
source = "pypi"
pypi = "qasync"

["media-libs/libdicom"]
source = "github"
github = "ImagingDataCommons/libdicom"
use_latest_release = true
prefix = "v"

["media-libs/openslide"]
source = "github"
github = "openslide/openslide"
use_latest_release = true
prefix = "v"

["media-plugins/kotonoha"]
source = "github"
github = "locez/kotonoha"
use_max_tag = true
prefix = "v"

["net-misc/tsshd"]
source = "github"
github = "trzsz/tsshd"
use_latest_release = true
prefix = "v"

["sys-kernel/cachyos-sources"]
source = "github"
github = "CachyOS/linux"
use_max_tag = true
include_regex = "cachyos-[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+"
from_pattern = "^cachyos-"
to_pattern = ""

["sys-kernel/xanmod-sources"]
source = "gitlab"
gitlab = "xanmod/linux"
use_max_tag = true
include_regex = "[0-9]+\\.[0-9]+\\.[0-9]+-xanmod[0-9]+"
from_pattern = "-xanmod[0-9]+$"
to_pattern = ""

["x11-misc/flatpak-xdg-utils"]
source = "github"
github = "flatpak/flatpak-xdg-utils"
use_latest_release = true
